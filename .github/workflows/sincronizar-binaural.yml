name: Sincronizar con Binaural

# Copia a diario los cambios de la rama 20.0 de binaural-dev/odoo-venezuela.
# También se puede ejecutar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC (03:17 hora de Venezuela)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-binaural
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Traer y unir los cambios de Binaural
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/binaural-dev/odoo-venezuela.git
          git fetch --no-tags upstream 20.0
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Sin cambios nuevos en Binaural."
            exit 0
          fi
          git merge --no-edit -m "Sincronizar con binaural-dev/odoo-venezuela 20.0" FETCH_HEAD
          git push origin main
